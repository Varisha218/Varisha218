<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 24" width="900" height="24" role="presentation" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="l" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2185B" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#C2185B"/>
      <stop offset="0.5" stop-color="#F8BBD0"/>
      <stop offset="0.7" stop-color="#4A1D6B"/>
      <stop offset="1" stop-color="#4A1D6B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="40" y="11" width="820" height="2" rx="1" fill="url(#l)"/>
  <!-- travelling light -->
  <circle cy="12" r="3.5" fill="#F8BBD0">
    <animate attributeName="cx" values="60;840;60" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>
  <!-- centre ornament -->
  <g transform="translate(450 12)">
    <rect x="-6" y="-6" width="12" height="12" fill="#C2185B" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="45;405" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-3" y="-3" width="6" height="6" fill="#F8BBD0" transform="rotate(45)">
      <animateTransform attributeName="transform" type="rotate" values="405;45" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
  <circle cx="420" cy="12" r="2" fill="#F8BBD0"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="480" cy="12" r="2" fill="#F8BBD0"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
</svg>
